<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="container">

        <form action="https://sheetdb.io/api/v1/g5lhft9k5d5vi" method="post">
            <h1>Formulário</h1>

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="data[nome]" placeholder="Digite seu nome" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="data[email]" placeholder="Insira seu Email" required>

            <label for="fone">Telefone:</label>
            <input type="tel" id="fone" name="data[telefone]" 
                pattern="[0-9]{2}-[0-9]{9}" 
                placeholder="00-000000000" required>

            <label for="sexo">Sexo:</label>
            <select name="data[sexo]" id="sexo" required>
                <option value="">Selecione</option>
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
            </select>

            <label for="estado_civil">Estado civil:</label>
            <select name="data[estado_civil]" id="estado_civil">
                <option value="">Selecione</option>
                <option value="solteiro">Solteiro</option>
                <option value="casado">Casado</option>
                <option value="viuvo">Viúvo</option>
            </select>

            <label for="profissao">Profissão</label>
            <input type="text" id="profissao" name="data[profissao]" placeholder="Informe sua profissão">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>

            <label for="horario">Horário desejado</label>
            <select name="data[horario]" id="horario">
                <option value="">Selecione</option>
                <option value="manha">Manhã</option>
                <option value="tarde">Tarde</option>
                <option value="noite">Noite</option>
            </select>

            <label for="escolaridade">Escolaridade:</label>
            <select name="data[escolaridade]" id="escolaridade" required>
                <option value="">Selecione</option>
                <option value="fundamental">Ensino Fundamental</option>
                <option value="medio">Ensino Médio Completo</option>
                <option value="superior">Ensino Superior Completo</option>
            </select>

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="data[nascimento]" required>

            <label for="link">Seu LinkedIn</label>
            <input type="url" id="link" name="data[link]" placeholder="Opcional">

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="data[cidade]" required>

            <label for="estado">Estado</label>
            <input type="text" id="estado" name="data[estado]" required>

            <div class="botoes">
                <button type="submit" id="enviar">Enviar</button>
                <input type="reset" value="Limpar">
            </div>

        </form>
    </div>

    <script src="escripty.js"></script>

</body>

</html>
